<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Talk To Your Data{% endblock %}</title>
  <meta name="description" content="{% block description %}Ask a question of a document and read the passages that back the answer.{% endblock %}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="preload" href="{{ url_for('static', path='fonts/literata-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', path='fonts/atkinson-hyperlegible-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ttyd-theme');
        if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); }
      } catch (e) {}
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}" data-host="{% if public_url and 'onrender.com' in public_url %}render{% endif %}"{% block body_attrs %}{% endblock %}>
  <a class="skip" href="#main">Skip to content</a>
  <div class="page">
    <header class="site-head">
      <div class="site-head__id">
        <a class="site-name" href="/">Talk To Your Data</a>
        <p class="site-deck">Ask a question of a document and read the passages that back the answer.</p>
      </div>
      <nav class="site-nav" aria-label="Site">
        {% block nav_link %}<a class="site-nav__link" href="/about">About</a>{% endblock %}
        <button type="button" class="theme-toggle" id="theme-toggle" data-next="dark" aria-label="Switch to dark mode">
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M12.6 2.2a7.5 7.5 0 1 0 5.2 11.5 6.2 6.2 0 0 1-5.2-11.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.5v2.4M10 16.1v2.4M1.5 10h2.4M16.1 10h2.4M4 4l1.7 1.7M14.3 14.3 16 16M4 16l1.7-1.7M14.3 5.7 16 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="theme-toggle__label">Dark mode</span>
        </button>
      </nav>
    </header>

    <main id="main" class="site-main">
      {% block main %}{% endblock %}
    </main>

    <footer class="site-foot">
      <p>Built with fastembed, SQLite (FTS5 and sqlite-vec) and Groq, on one free-tier container. <a href="https://github.com/sahajm99/talk-to-your-data">Source on GitHub</a>.</p>
    </footer>
  </div>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
